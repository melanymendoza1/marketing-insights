"use strict";
var DATA={campaigns:[],traffic:[],events:[]};
if(!DATA.campaigns)DATA.campaigns=[]; if(!DATA.traffic)DATA.traffic=[]; if(!DATA.events)DATA.events=[];

var BRANDS=[
  {key:"ford",name:"Ford"},{key:"dongfeng",name:"Dongfeng"},{key:"chery",name:"Chery"},{key:"ram",name:"Ram"},{key:"mazda",name:"Mazda"}
];
var BNAME={}; BRANDS.forEach(function(b){BNAME[b.key]=b.name;});
var MES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
var VERD={good:"Funcionó",mid:"Regular",bad:"No funcionó"};
var state={}; // per-brand model filter
var fM="all", fB="all", readOnly=false, saving=false, artifact=null, downloads=null, capChecked=false;
var uid=function(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var money=function(n){return "$"+Math.round(n||0).toLocaleString("en-US");};
var kfmt=function(n){return n>=1000?"$"+(n/1000).toFixed(1)+"k":"$"+Math.round(n);};
var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};
var monthLabel=function(m){ if(!m)return "—"; var p=m.split("-"); return MES[parseInt(p[1],10)-1]+" "+p[0]; };

// ---- selectors ----
function campFor(bk){ return DATA.campaigns.filter(function(c){return c.brand===bk && (fM==="all"||c.month===fM);}); }
function trafFor(bk){ return DATA.traffic.filter(function(t){return t.brand===bk && (fM==="all"||t.month===fM);}); }
function evFor(bk){ return DATA.events.filter(function(e){return e.brand===bk && (fM==="all"||e.month===fM);}); }
function campTotal(c){return (c.aware||0)+(c.consid||0)+(c.conv||0);}
function brandInv(bk){ var s=0; campFor(bk).forEach(function(c){s+=campTotal(c);}); evFor(bk).forEach(function(e){s+=(e.cost||0);}); return s; }
function brandLeads(bk){ var s=0; campFor(bk).forEach(function(c){s+=(c.leads||0);}); return s; }
function allMonths(){ var set={}; DATA.campaigns.concat(DATA.events).concat(DATA.traffic).forEach(function(r){if(r.month)set[r.month]=1;}); return Object.keys(set).sort(); }
function activeBrands(){ return BRANDS.filter(function(b){ return fB==="all"||fB===b.key; }); }

// ---- SHELL ----
var SHELL='<div class="wrap">'
+'<header><div class="logo"><img src="logo.png" alt="Logo" style="width:100%;height:100%;object-fit:contain"></div><div><h1>Marketing Insights</h1><p class="sub">Inversión, tráfico y resultados · Ford · Chery · Mazda · Ram · Dongfeng</p></div>'
+'<div class="spacer"></div><div id="saveslot"></div>'
+'<button class="btn" id="exportBtn">↓ Exportar</button>'
+'<div class="menu-wrap"><button class="btn primary" id="regBtn">+ Registrar</button><div class="menu" id="regMenu" hidden>'
+'<button data-new="campaign"><b>Campaña de pauta</b><span>Inversión por etapa, leads y CPL</span></button>'
+'<button data-new="traffic"><b>Resultado de tráfico</b><span>Personas, inversión y costo por zona</span></button>'
+'<button data-new="event"><b>Evento / BTL</b><span>Foto, inversión y resultados</span></button>'
+'</div></div></header>'
+'<div id="banner"></div>'
+'<div class="bar-tools"><div class="chips" id="months"></div><div class="chips" id="brands"></div></div>'
+'<div class="lbl">Resumen ejecutivo</div><div class="kpis" id="kpis"></div>'
+'<div class="lbl">Inversión por marca</div><div class="card cmp" id="cmp"></div>'
+'<div class="lbl">Cargar presupuestos</div><div class="card" id="importcard"></div>'
+'<div class="lbl">Detalle por marca</div><div id="sections"></div>'
+'<div class="lbl">Análisis del mes con IA — ¿cuánto contribuyó cada cosa?</div><div class="ai" id="ai"></div>'
+'<p class="foot">Panel compartido de Marketing Insights. Los cambios se guardan y se sincronizan con tu equipo.<br>Pauta lleva gráficos; eventos van con foto + inversión + resultados. El tráfico y los resultados se llenan a mano cada mes.</p>'
+'</div><div id="tip" class="tip" hidden></div><div id="toast"></div>';

// ---- charts ----
function lineChart(pairs){ // pairs: [{m:'2026-08', v:number}] sorted
  var W=820,H=250,pl=40,pr=22,pt=30,pb=30, n=pairs.length;
  if(n===0) return '<div class="empty">Aún sin meses con tráfico. Registra un resultado para empezar la línea.</div>';
  var mx=Math.max.apply(null,pairs.map(function(p){return p.v;}))*1.2||1;
  var x=function(i){return n===1?W/2:pl+(W-pl-pr)*(i/(n-1));}, y=function(v){return H-pb-(H-pt-pb)*(v/mx);};
  var grid="";for(var g=0;g<=3;g++){var gy=pt+(H-pt-pb)*(g/3);var gv=Math.round(mx*(1-g/3));
    grid+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(gy+3)+'" font-size="10" fill="var(--faint)" text-anchor="end" font-family="var(--fm)">'+gv+'</text>';}
  var pts=pairs.map(function(p,i){return {x:x(i),y:y(p.v),v:p.v,m:p.m};});
  var area="",path="",dots="",vals="",hits="",lbls="";
  if(n===1){ dots='<circle cx="'+pts[0].x+'" cy="'+pts[0].y+'" r="5" fill="var(--line)"/>';
    vals='<text x="'+pts[0].x+'" y="'+(pts[0].y-12)+'" font-size="12" font-weight="600" fill="var(--text)" text-anchor="middle" font-family="var(--fm)">'+pts[0].v+'</text>';
    lbls='<text x="'+pts[0].x+'" y="'+(H-9)+'" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="var(--fm)">'+monthLabel(pts[0].m)+'</text>';
  } else {
    area="M"+pts[0].x+","+pts[0].y+" "+pts.map(function(p){return "L"+p.x+","+p.y;}).join(" ")+" L"+pts[n-1].x+","+(H-pb)+" L"+pts[0].x+","+(H-pb)+" Z";
    path="M"+pts.map(function(p){return p.x+","+p.y;}).join(" L");
    dots=pts.map(function(p){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--surface)" stroke="var(--line)" stroke-width="2.5"/>';}).join("");
    vals=pts.map(function(p){return '<text x="'+p.x+'" y="'+(p.y-11)+'" font-size="11" font-weight="600" fill="var(--text)" text-anchor="middle" font-family="var(--fm)">'+p.v+'</text>';}).join("");
    hits=pts.map(function(p){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="16" fill="transparent" data-tip="'+monthLabel(p.m)+': '+p.v+' personas" style="cursor:pointer"/>';}).join("");
    lbls=pts.map(function(p){return '<text x="'+p.x+'" y="'+(H-9)+'" font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="var(--fm)">'+monthLabel(p.m)+'</text>';}).join("");
  }
  return '<svg class="traf-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tráfico por mes">'
    +grid+(area?'<path d="'+area+'" fill="var(--accent-soft)" opacity="0.65"/>':"")+(path?'<path d="'+path+'" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>':"")+dots+vals+lbls+hits+'</svg>';
}

// ---- render ----
function render(){
  var brs=activeBrands().map(function(b){return b.key;});
  var inv=0,leads=0,acts=0;
  brs.forEach(function(bk){ inv+=brandInv(bk); leads+=brandLeads(bk);
    acts+=campFor(bk).filter(function(c){return campTotal(c)>0;}).length+evFor(bk).length; });
  var cpl=leads>0?inv/leads:0;
  el("kpis").innerHTML=''
    +kpi("Inversión total",kfmt(inv),brs.filter(function(bk){return brandInv(bk)>0;}).length+" marcas activas",true)
    +kpi("Leads proyectados",Math.round(leads).toLocaleString(),"pauta digital",false)
    +kpi("Costo por lead",leads>0?"$"+cpl.toFixed(1):"—","promedio ponderado",false)
    +kpi("Acciones / ítems",acts,"en el período",false);

  var rows=brs.map(function(bk){return {key:bk,name:BNAME[bk],val:brandInv(bk)};}).filter(function(r){return r.val>0;}).sort(function(a,b){return b.val-a.val;});
  var mx=Math.max.apply(null,rows.map(function(r){return r.val;}))||1;
  el("cmp").innerHTML=rows.length?rows.map(function(r){return '<div class="cmp-row"><div class="nm"><span class="st" style="background:var(--'+r.key+'-ink)"></span>'+r.name+'</div><div class="track"><div class="fill" style="width:'+(r.val/mx*100)+'%;background:var(--'+r.key+')"></div></div><div class="val">'+money(r.val)+'</div></div>';}).join(""):'<div class="empty">Sin inversión registrada para este filtro.</div>';

  el("sections").innerHTML=activeBrands().map(function(b){return brandSection(b.key);}).join("");
  renderImport();
  renderAI(brs,inv,leads,cpl);
  renderSaveSlot();
  attachTips();
}
function kpi(l,v,s,hi){return '<div class="kpi'+(hi?' hi':'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';}
function addLink(type,brand){ if(readOnly) return ''; return '<button class="btn sm add" data-new="'+type+'" data-brand="'+brand+'">+ Agregar</button>'; }

function brandSection(bk){
  var bc='var(--'+bk+'-ink)';
  var camp=campFor(bk), traf=trafFor(bk), evs=evFor(bk);
  var head='<div class="brand"><div class="brand-head" style="--bc:'+bc+'"><span class="bn">'+BNAME[bk]+'</span><div class="tags">'
    +(brandInv(bk)>0?'<span class="tag tp">'+money(brandInv(bk))+'</span>':'')
    +(camp.length?'<span class="tag">'+Math.round(brandLeads(bk))+' leads proy.</span>':'')
    +'</div></div><div class="brand-body">';
  var body='';
  if(!camp.length && !traf.length && !evs.length){
    body='<div class="empty">📋 <b>'+BNAME[bk]+' está lista para llenarse.</b><br>Registra su primera campaña de pauta, resultado de tráfico o evento y aparecerá aquí.'
      +(readOnly?'':'<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+addLinkBig("campaign",bk,"Campaña")+addLinkBig("traffic",bk,"Tráfico")+addLinkBig("event",bk,"Evento")+'</div>')+'</div>';
    return head+body+'</div></div>';
  }
  // PAUTA
  body+='<div class="block-lbl" style="--bc:'+bc+'"><span class="ico"></span>Plan de pauta'+(camp.length?' · '+monthTags(camp):'')+'<span class="add">'+addLink("campaign",bk)+'</span></div>';
  if(camp.length){ body+=pautaBlock(bk,camp); }
  else { body+='<div class="empty">Sin campañas de pauta en este filtro.</div>'; }
  // TRAFICO
  body+='<div class="divider"></div><div class="block-lbl" style="--bc:'+bc+'"><span class="ico"></span>Resultados de tráfico — cómo van viniendo<span class="add">'+addLink("traffic",bk)+'</span></div>';
  if(traf.length){ body+=trafficBlock(bk,traf,bc); }
  else { body+='<div class="empty">📈 Aún sin resultados de tráfico. Registra personas, inversión y costo por zona (Sierra/Costa) cada mes.</div>'; }
  // EVENTOS
  if(evs.length || bk==="chery" || bk==="ram"){
    body+='<div class="divider"></div><div class="block-lbl" style="--bc:'+bc+'"><span class="ico"></span>Eventos / BTL — foto, inversión y resultados<span class="add">'+addLink("event",bk)+'</span></div>';
    if(evs.length){ body+=eventsBlock(evs); }
    else { body+='<div class="empty">Sin eventos en este filtro.</div>'; }
  }
  return head+body+'</div></div>';
}
function addLinkBig(type,bk,txt){ return '<button class="btn sm" data-new="'+type+'" data-brand="'+bk+'">+ '+txt+'</button>'; }
function monthTags(recs){ var s={}; recs.forEach(function(r){if(r.month)s[r.month]=1;}); return Object.keys(s).sort().map(monthLabel).join(", "); }

function normModel(s){ return stripAcc(s).replace(/\s+/g," "); }
function pautaBlock(bk,camp){
  var groups={}, order=[];
  camp.forEach(function(c){ var key=normModel(c.model); if(!groups[key]){ groups[key]={key:key,model:c.model,aware:0,consid:0,conv:0,leads:0,meses:0}; order.push(key); } var g=groups[key]; g.aware+=(c.aware||0); g.consid+=(c.consid||0); g.conv+=(c.conv||0); g.leads+=(c.leads||0); g.meses++; });
  var all=order.map(function(k){return groups[k];});
  var gtot=function(g){return g.aware+g.consid+g.conv;};
  var sel=state[bk]||"all";
  var shown=sel==="all"?all:all.filter(function(g){return g.key===sel;});
  var mxM=Math.max.apply(null,all.map(gtot))||1;
  var multi=all.some(function(g){return g.meses>1;});
  var filter='<div class="modfilter"><label>Filtrar modelo</label><select data-brand="'+bk+'"><option value="all"'+(sel==="all"?" selected":"")+'>Todos los modelos</option>'
    +all.map(function(g){return '<option value="'+esc(g.key)+'"'+(sel===g.key?" selected":"")+'>'+esc(g.model)+'</option>';}).join("")+'</select>'
    +(multi?'<span class="ghint" style="margin-left:2px">Cada modelo suma sus meses. Filtra por mes arriba para ver uno solo.</span>':'')+'</div>';
  var byModel=shown.slice().sort(function(a,b){return gtot(b)-gtot(a);}).map(function(g){ var t=gtot(g); var cpl=g.leads>0?(g.conv/g.leads):0;
    return '<div class="hbar"><div class="hl">'+esc(g.model)+'</div><div class="htrack"><div class="seg" style="width:'+(t/mxM*100)+'%;background:var(--'+bk+')" data-tip="'+esc(g.model)+': '+money(t)+' · '+(g.leads?Math.round(g.leads)+" leads":"— leads")+(cpl?" · CPL $"+cpl.toFixed(1):"")+(g.meses>1?" · "+g.meses+" meses":"")+'"></div></div><div class="hv">'+money(t)+'</div></div>';}).join("");
  var byStage=shown.slice().sort(function(a,b){return gtot(b)-gtot(a);}).map(function(g){var t=gtot(g);
    return '<div class="hbar"><div class="hl">'+esc(g.model)+'</div><div class="htrack">'
      +'<div class="seg" style="width:'+(g.aware/mxM*100)+'%;background:var(--st1)" data-tip="Awareness · '+money(g.aware)+'"></div>'
      +'<div class="seg" style="width:'+(g.consid/mxM*100)+'%;background:var(--st2)" data-tip="Consideración · '+money(g.consid)+'"></div>'
      +'<div class="seg" style="width:'+(g.conv/mxM*100)+'%;background:var(--st3)" data-tip="Conversión · '+money(g.conv)+'"></div>'
      +'</div><div class="hv">'+money(t)+'</div></div>';}).join("");
  return filter+'<div class="charts"><div class="chart"><h4>Inversión por modelo</h4><p class="cap">Total invertido en cada modelo (suma de los meses del filtro). Pasa el cursor para leads y CPL.</p>'+byModel+'</div>'
    +'<div class="chart"><h4>Inversión por etapa del embudo</h4><p class="cap">Reparto entre awareness, consideración y conversión. Pasa el cursor sobre cada tramo.</p>'+byStage
    +'<div class="legend"><span><i style="background:var(--st1)"></i>Awareness</span><span><i style="background:var(--st2)"></i>Consideración</span><span><i style="background:var(--st3)"></i>Conversión</span></div></div></div>';
}

function trafficBlock(bk,traf,bc){
  var totP=0,totInv=0; traf.forEach(function(t){totP+=(t.personas||0);totInv+=(t.inversion||0);});
  var cpu=totP>0?Math.round(totInv/totP):0;
  // sierra/costa promedio ponderado por personas
  var sN=0,sD=0,cN=0,cD=0;
  traf.forEach(function(t){ if(t.sierra){sN+=t.sierra*(t.personas||1);sD+=(t.personas||1);} if(t.costa){cN+=t.costa*(t.personas||1);cD+=(t.personas||1);} });
  var sAvg=sD?Math.round(sN/sD):0, cAvg=cD?Math.round(cN/cD):0;
  // line: personas por mes (suma)
  var byMonth={}; traf.forEach(function(t){ byMonth[t.month]=(byMonth[t.month]||0)+(t.personas||0); });
  var pairs=Object.keys(byMonth).sort().map(function(m){return {m:m,v:byMonth[m]};});
  // zona por modelo (ultimo valor no nulo)
  var zm={}; traf.forEach(function(t){ if(!zm[t.model])zm[t.model]={s:0,c:0}; if(t.sierra)zm[t.model].s=t.sierra; if(t.costa)zm[t.model].c=t.costa; });
  var zkeys=Object.keys(zm).filter(function(m){return zm[m].s||zm[m].c;});
  var mxZ=1; zkeys.forEach(function(m){mxZ=Math.max(mxZ,zm[m].s,zm[m].c);});
  var zona=zkeys.sort(function(a,b){return Math.max(zm[b].s,zm[b].c)-Math.max(zm[a].s,zm[a].c);}).map(function(m){
    return '<div class="zbar"><div class="zl">'+esc(m)+'</div><div class="zrows">'
      +'<div class="zrow s"><div class="zt" style="width:'+(zm[m].s/mxZ*100)+'%"></div><div class="zv">$'+zm[m].s+' sierra</div></div>'
      +'<div class="zrow c"><div class="zt" style="width:'+(zm[m].c/mxZ*100)+'%"></div><div class="zv">$'+zm[m].c+' costa</div></div></div></div>';}).join("");
  // modtraf por modelo
  var pm={}; traf.forEach(function(t){ if(!pm[t.model])pm[t.model]={p:0,inv:0,id:t.id}; pm[t.model].p+=(t.personas||0); pm[t.model].inv+=(t.inversion||0); });
  var mt=Object.keys(pm).map(function(m){var o=pm[m];var c=o.p>0?Math.round(o.inv/o.p):0;
    return '<div class="mt"><div class="mth"><b>'+esc(m)+'</b><span class="cpu">'+(c?"$"+c:"—")+'<span class="per"> /pers</span></span>'
      +(readOnly?'':'<button class="mt-edit" data-edit="traffic:'+o.id+'" title="Editar">✎</button>')+'</div>'
      +'<div class="row">Tráfico <b>'+o.p.toLocaleString()+'</b></div><div class="row">Inversión <b>'+(o.inv?money(o.inv):"—")+'</b></div></div>';}).join("");
  var gap=(sAvg&&cAvg)?(sAvg/cAvg).toFixed(1)+"×":"—";
  return '<div class="traf-kpis">'
    +'<div class="tk"><div class="l">Tráfico total</div><div class="v">'+totP.toLocaleString()+'</div></div>'
    +'<div class="tk"><div class="l">Costo x persona</div><div class="v">'+(cpu?"$"+cpu:"—")+'</div></div>'
    +'<div class="tk"><div class="l">Sierra</div><div class="v sierra">'+(sAvg?"$"+sAvg:"—")+'</div></div>'
    +'<div class="tk"><div class="l">Costa · brecha '+gap+'</div><div class="v costa">'+(cAvg?"$"+cAvg:"—")+'</div></div></div>'
    +'<div class="chart"><h4>Tráfico de la red por mes</h4><p class="cap">Personas que llegaron cada mes. Se llena a medida que registras resultados.</p>'+lineChart(pairs)+'</div>'
    +(zona?'<div class="chart" style="margin-top:20px"><h4>Costo por tráfico según zona</h4><p class="cap">Cuánto cuesta traer una persona en Sierra (rojo) vs Costa (verde), por modelo.</p>'+zona+'</div>':'')
    +'<div class="block-lbl" style="--bc:'+bc+';margin-top:20px"><span class="ico"></span>Modelo por modelo · tráfico e inversión</div><div class="modtraf">'+mt+'</div>';
}

function eventsBlock(evs){
  return '<div class="events">'+evs.map(function(e){
    var photo=e.photo?'style="background-image:url('+"'"+e.photo+"'"+')"':'';
    var res;
    if(e.leads!=null||e.trafico!=null||e.cotizaciones!=null){
      var cells='';
      if(e.leads!=null)cells+='<div class="rc"><div class="rl">Leads</div><div class="rv">'+e.leads+'</div></div>';
      if(e.trafico!=null)cells+='<div class="rc"><div class="rl">Tráfico</div><div class="rv">'+e.trafico+'</div></div>';
      if(e.cotizaciones!=null)cells+='<div class="rc"><div class="rl">Cotizac.</div><div class="rv">'+e.cotizaciones+'</div></div>';
      res='<div class="res-g">'+cells+'</div>';
    } else { res='<div class="pend">Pendiente de registrar resultados</div>'; }
    var vpill=e.veredicto?'<span class="verdict v-'+e.veredicto+'">'+VERD[e.veredicto]+'</span>':'';
    return '<div class="ev">'+(readOnly?'':'<button class="edit-btn" data-edit="event:'+e.id+'" title="Editar">✎</button>')
      +'<div class="photo" '+photo+'>'+(e.photo?'':'<span class="ic">📷</span><span>Evidencia / foto</span>')+'</div>'
      +'<div class="eb"><div class="en">'+esc(e.name)+'</div>'
      +'<div class="einv"><span class="ev-v">'+money(e.cost)+'</span><span class="ev-l">inversión · '+monthLabel(e.month)+'</span></div>'
      +'<div class="res"><div class="res-l"><span>Resultados</span>'+vpill+'</div>'+res
      +(e.nota?'<div style="font-size:11.5px;color:var(--muted);margin-top:7px">'+esc(e.nota)+'</div>':'')+'</div></div></div>';
  }).join("")+'</div>';
}

function renderAI(brs,inv,leads,cpl){
  var contrib=brs.map(function(bk){return {key:bk,name:BNAME[bk],val:brandInv(bk)};}).filter(function(r){return r.val>0;}).sort(function(a,b){return b.val-a.val;});
  var sum=contrib.reduce(function(s,x){return s+x.val;},0)||1;
  var ins="";
  var best=null,worst=null;
  brs.forEach(function(bk){ campFor(bk).forEach(function(c){ if(c.cpl>0){ if(!best||c.cpl<best.cpl)best={m:c.model,b:BNAME[bk],cpl:c.cpl}; if(!worst||c.cpl>worst.cpl)worst={m:c.model,b:BNAME[bk],cpl:c.cpl}; } }); });
  if(best) ins+=insLine("var(--good)","Modelo más eficiente: <b>"+best.b+" "+best.m+"</b>, CPL <b>$"+best.cpl+"</b>"+(worst&&worst.cpl&&worst.cpl!==best.cpl?" — "+Math.round(worst.cpl/best.cpl)+"× mejor que "+worst.b+" "+worst.m+" ($"+worst.cpl+")":"")+".");
  // zona insight
  var ztot={s:0,sd:0,c:0,cd:0};

  if(ztot.sd&&ztot.cd){ var sa=Math.round(ztot.s/ztot.sd), ca=Math.round(ztot.c/ztot.cd);
    ins+=insLine("var(--bad)","Traer una persona a la <b>Sierra cuesta $"+sa+"</b> vs <b>$"+ca+" en Costa</b>"+(ca?" — <b>"+(sa/ca).toFixed(1)+"× más caro</b>":"")+". Vale reforzar Costa o revisar la pauta de Sierra."); }

  if(evtot) ins+=insLine("var(--warn)","Hay <b>"+pend+" de "+evtot+" eventos</b> sin resultados cargados. Al registrar sus leads/tráfico sabremos su costo real vs la pauta digital.");

  var mx=Math.max.apply(null,contrib.map(function(c){return c.val;}))||1;

    +'<div class="card cmp" style="box-shadow:none;margin-bottom:6px">'+(contrib.length?contrib.map(function(c){return '<div class="cmp-row"><div class="nm"><span class="st" style="background:var(--'+c.key+'-ink)"></span>'+c.name+'</div><div class="track"><div class="fill" style="width:'+(c.val/mx*100)+'%;background:var(--'+c.key+')"></div></div><div class="val">'+Math.round(c.val/sum*100)+'%</div></div>';}).join(""):'<div class="empty">Sin datos.</div>')+'</div>'+ins;

function numify(v){ if(v==null)return null; if(typeof v==="number")return v; var n=parseFloat(v); return isNaN(n)?null:n; }

   })
   .catch(function(){ connErr=true; saving=false; render(); }); }
function remoteSave(type,payload,id){ if(!sb){ toast("Sin conexión a la base de datos."); return; }

  q.then(function(r){ if(r.error){ setSaving(false); toast("No se pudo guardar: "+r.error.message); return; } loadAll(); }); }
function remoteDelete(type,id){ if(!sb){ toast("Sin conexión."); return; } setSaving(true);
  sb.from(TABLE[type]).delete().eq("id",id).then(function(r){ if(r.error){ setSaving(false); toast("No se pudo eliminar."); return; } loadAll(); }); }

function downloadBlob(filename,text,mime){ try{ var blob=new Blob([text],{type:mime||"text/csv;charset=utf-8"}); var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },120); }catch(e){ fallbackCopy(text); } }

function parseCSV(text){
  text=text.replace(/^﻿/,""); var rows=[],row=[],cur="",q=false;
  for(var i=0;i<text.length;i++){ var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"')q=true; else if(ch===","){row.push(cur);cur="";} else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur="";} else if(ch==="\r"){} else cur+=ch; } }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function stripAcc(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
function brandKey(s){ var v=stripAcc(s); if(v==="df"||v.indexOf("dongfeng")>=0)return "dongfeng"; var f=BRANDS.find(function(b){return stripAcc(b.name)===v||v.indexOf(b.key)>=0;}); return f?f.key:null; }
function verdKey(s){ var v=stripAcc(s); if(!v)return ""; if(v.indexOf("no")===0||v.indexOf("no func")>=0)return "bad"; if(v.indexOf("regular")>=0)return "mid"; if(v.indexOf("func")>=0||v==="si"||v==="ok"||v==="bueno")return "good"; return ""; }
var MESMAP={ene:"01",feb:"02",mar:"03",abr:"04",may:"05",jun:"06",jul:"07",ago:"08",sep:"09",set:"09",oct:"10",nov:"11",dic:"12"};
function parseMonth(s){ s=String(s||"").trim(); var m=s.match(/(\d{4})[-\/](\d{1,2})/); if(m)return m[1]+"-"+("0"+m[2]).slice(-2);
  var m2=stripAcc(s).match(/([a-z]{3})[a-z]*\s*(\d{4})/); if(m2&&MESMAP[m2[1]])return m2[2]+"-"+MESMAP[m2[1]];
  return s||""; }
function importFile(file){
  var name=(file.name||"").toLowerCase();
  if(name.match(/\.csv$/)){ var r=new FileReader(); r.onload=function(){ handleRows(parseCSV(r.result)); }; r.readAsText(file); return; }
  if(!window.XLSX){ toast("El lector de Excel aún carga. Reintenta en unos segundos o sube un .csv."); return; }
  var r2=new FileReader(); r2.onload=function(){ try{ var wb=XLSX.read(new Uint8Array(r2.result),{type:"array"}); var all=[];
    wb.SheetNames.forEach(function(sn){ var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""}); if(rows.length)all=all.concat(rows); });
    handleRows(all); }catch(e){ toast("No pude leer ese Excel. Prueba con la plantilla o guárdalo como .csv."); } };
  r2.readAsArrayBuffer(file);
}
function handleRows(rows){
  // encuentra fila de encabezado
  var hi=-1;
  for(var i=0;i<rows.length;i++){ var joined=stripAcc((rows[i]||[]).join("|")); if(joined.indexOf("tipo")>=0 && joined.indexOf("marca")>=0){ hi=i; break; } }
  if(hi<0){ toast("No encontré los encabezados. Descarga la plantilla y respeta la primera fila."); return; }
  var hdr=rows[hi].map(function(h){return stripAcc(h);});
  function col(names){ for(var j=0;j<hdr.length;j++){ for(var n=0;n<names.length;n++){ if(hdr[j]===names[n]||hdr[j].indexOf(names[n])>=0)return j; } } return -1; }
  var idx={ tipo:col(["tipo"]),marca:col(["marca"]),nombre:col(["modelo/nombre","modelo","nombre"]),mes:col(["mes"]),
    aware:col(["awareness"]),consid:col(["consideracion"]),conv:col(["conversion"]),inv:col(["inversion"]),
    leads:col(["leads"]),cpl:col(["cpl"]),personas:col(["personas"]),sierra:col(["sierra"]),costa:col(["costa"]),
    trafico:col(["trafico"]),cotiz:col(["cotizaciones","cotizac"]),verd:col(["veredicto"]),nota:col(["nota"]) };
  var get=function(r,k){ return idx[k]>=0?(r[idx[k]]!=null?String(r[idx[k]]).trim():""):""; };
  var n2=function(v){ v=String(v).replace(/[$,\s]/g,""); var x=parseFloat(v); return isNaN(x)?0:x; };
  var nOrNull=function(v){ v=String(v).replace(/[$,\s]/g,""); if(v==="")return null; var x=parseFloat(v); return isNaN(x)?null:x; };
  var addC=[],addT=[],addE=[], skipped=0;
  for(var i2=hi+1;i2<rows.length;i2++){ var r=rows[i2]||[]; if(!r.join("").trim())continue;
    var tipo=stripAcc(get(r,"tipo")); var bk=brandKey(get(r,"marca"));
    if(!bk){ skipped++; continue; }
    var mes=parseMonth(get(r,"mes"));
    if(tipo.indexOf("pauta")>=0||tipo.indexOf("campa")>=0){
      addC.push({brand:bk,model:get(r,"nombre")||"(sin nombre)",month:mes,aware:n2(get(r,"aware")),consid:n2(get(r,"consid")),conv:n2(get(r,"conv")),leads:n2(get(r,"leads")),cpl:n2(get(r,"cpl"))});
    } else if(tipo.indexOf("trafico")>=0){
      addT.push({brand:bk,model:get(r,"nombre")||"(sin nombre)",month:mes,personas:n2(get(r,"personas")),inversion:n2(get(r,"inv")),sierra:nOrNull(get(r,"sierra")),costa:nOrNull(get(r,"costa"))});
    } else if(tipo.indexOf("evento")>=0||tipo.indexOf("btl")>=0){
      addE.push({brand:bk,name:get(r,"nombre")||"(evento)",month:mes,cost:n2(get(r,"inv")),photo:"",leads:nOrNull(get(r,"leads")),trafico:nOrNull(get(r,"trafico")),cotizaciones:nOrNull(get(r,"cotiz")),veredicto:verdKey(get(r,"verd")),nota:get(r,"nota")});
    } else { skipped++; }
  }
  var tot=addC.length+addT.length+addE.length;
  if(tot===0){ toast("No se cargó nada. Revisa la columna TIPO (Pauta / Trafico / Evento) y MARCA."); return; }
  setSaving(true);
  Promise.all([remoteBulk("campaign",addC),remoteBulk("traffic",addT),remoteBulk("event",addE)]).then(function(rs){
    var err=(rs||[]).some(function(r){return r&&r.error;});
    loadAll();
    if(err) toast("Algunas filas no se cargaron. Revisa el formato.");
    else toast("Cargados: "+addC.length+" pauta · "+addT.length+" tráfico · "+addE.length+" eventos"+(skipped?" ("+skipped+" filas omitidas)":""));
  });
}

// ---- Importador guiado (Excel crudo, mapeo de columnas) ----
var GST={files:[],cur:0};
function openGuided(){
  var html='<div class="overlay" id="overlay"><div class="modal wide"><h3>Importar mis Excel (guiado)</h3>'
   +'<p class="msub">Sube tus presupuestos tal cual (varios a la vez). Por cada archivo eliges marca, tipo y mes, y qué columna es cada dato. Funciona con cualquier formato.</p>'
   +'<div class="field"><label>Archivos .xlsx / .csv (puedes elegir varios)</label><input type="file" id="gInput" accept=".xlsx,.xls,.csv" multiple></div>'
   +'<div id="gBody"></div>'
   +'<div class="modal-actions"><div class="spacer"></div><button type="button" class="btn" id="gClose">Cerrar</button></div></div></div>';
  var ov=document.createElement("div"); ov.innerHTML=html; document.body.appendChild(ov.firstChild);
  el("overlay").addEventListener("mousedown",function(e){ if(e.target.id==="overlay")closeForm(); });
  el("gClose").onclick=closeForm;
  el("gInput").onchange=function(e){ gParse(e.target.files); };
}
function gParse(fileList){
  var arr=[].slice.call(fileList); GST={files:[],cur:0}; var pending=arr.length; if(!pending)return;
  if(!window.XLSX){ toast("El lector de Excel aún carga, reintenta en unos segundos."); return; }
  arr.forEach(function(f){ var rd=new FileReader(); var isCsv=/\.csv$/i.test(f.name);
    rd.onload=function(){ try{ var wb= isCsv? XLSX.read(rd.result,{type:"string"}) : XLSX.read(new Uint8Array(rd.result),{type:"array"});
        GST.files.push({name:f.name,wb:wb,sheet:wb.SheetNames[0],marca:"",tipo:"evento",mes:(fM!=="all"?fM:""),header:0,map:{},_mapped:false});
      }catch(err){ GST.files.push({name:f.name,error:true}); }
      pending--; if(pending===0){ GST.cur=0; gRender(); } };
    if(isCsv) rd.readAsText(f); else rd.readAsArrayBuffer(f); });
}
function rowsOf(f){ return XLSX.utils.sheet_to_json(f.wb.Sheets[f.sheet],{header:1,raw:false,defval:""}); }
function colLetter(i){ return XLSX.utils.encode_col(i); }
function gAutoMap(f,hdr){ if(f._mapped)return;
  var find=function(subs){ for(var i=0;i<hdr.length;i++){ var h=stripAcc(hdr[i]); for(var k=0;k<subs.length;k++){ if(h.indexOf(subs[k])>=0)return i; } } return null; };
  if(f.tipo==="evento"){ f.map={nombre:find(["detalle","nombre","descripc","accion","item"]),inversion:find(["v.total","total","valor","inversion","costo","monto"]),leads:find(["leads"]),trafico:find(["trafico","visitas"]),cotizaciones:find(["cotiz"]),nota:find(["nota","observ"])}; }
  else if(f.tipo==="pauta"){ f.map={modelo:find(["producto","modelo","nombre","detalle"]),inversion:find(["total","inversion","valor","monto"]),leads:find(["leads"]),cpl:find(["cpl"])}; }
  else { f.map={modelo:find(["producto","modelo","nombre"]),personas:find(["personas","trafico","visitas"]),inversion:find(["inversion","total","valor"]),sierra:find(["sierra"]),costa:find(["costa"])}; }
  f._mapped=true;
}
function colOptions(hdr,cur,reqLbl){ var o='<option value="">'+reqLbl+'</option>'; for(var i=0;i<hdr.length;i++){ o+='<option value="'+i+'"'+(cur===i?' selected':'')+'>'+colLetter(i)+' — '+esc(String(hdr[i]).slice(0,22)||"(vacía)")+'</option>'; } return o; }
function mapSel(f,key,label,hdr,req){ return '<div class="field"><label>'+label+(req?' *':'')+'</label><select data-map="'+key+'">'+colOptions(hdr,(f.map[key]==null?null:f.map[key]),req?'— elige —':'(ninguna)')+'</select></div>'; }
function gMapFields(f,hdr){
  if(f.tipo==="evento") return mapSel(f,"nombre","Nombre / Detalle",hdr,true)+mapSel(f,"inversion","Inversión (V.Total)",hdr,true)+mapSel(f,"leads","Leads",hdr,false)+mapSel(f,"trafico","Tráfico",hdr,false)+mapSel(f,"cotizaciones","Cotizaciones",hdr,false)+mapSel(f,"nota","Nota",hdr,false);
  if(f.tipo==="pauta") return mapSel(f,"modelo","Modelo / Producto",hdr,true)+mapSel(f,"inversion","Inversión total",hdr,true)+mapSel(f,"leads","Leads",hdr,false)+mapSel(f,"cpl","CPL",hdr,false);
  return mapSel(f,"modelo","Modelo",hdr,true)+mapSel(f,"personas","Personas / Tráfico",hdr,true)+mapSel(f,"inversion","Inversión",hdr,false)+mapSel(f,"sierra","Costo Sierra",hdr,false)+mapSel(f,"costa","Costo Costa",hdr,false);
}
function gNum(v){ v=String(v).replace(/[$,\s]/g,""); var x=parseFloat(v); return isNaN(x)?0:x; }
function gNull(v){ v=String(v).replace(/[$,\s]/g,""); if(v==="")return null; var x=parseFloat(v); return isNaN(x)?null:x; }
function gIsTotal(s){ return /^(sub ?total|subtotal|total|totales|suma|gran total)$/.test(stripAcc(s)); }
function gDigCols(rows){
  for(var i=0;i<rows.length && i<20;i++){ var r=rows[i]||[]; var low=r.map(function(c){return stripAcc(c);});
    var iM=low.indexOf("producto"), iC=low.indexOf("cpl");
    if(iM>=0 && iC>=0){ var iL=-1; for(var x=iC+1;x<low.length;x++){ if(low[x]==="leads"){iL=x;break;} } if(iL<0)iL=iC+1;
      return {model:iM,cpl:iC,leads:iL}; } }
  return null;
}
function gParseDigital(f,rows){
  var c=f.digCols||gDigCols(rows); if(!c)return [];
  var recs=[], k=c.leads;
  for(var i=0;i<rows.length;i++){ var r=rows[i]||[];
    var idn=parseFloat(String(r[0]==null?"":r[0]).replace(/[^0-9.]/g,""));
    var model=r[c.model]!=null?String(r[c.model]).trim():"";
    if(isNaN(idn)||!model||gIsTotal(model)||stripAcc(model)==="producto")continue;
    var conv=gNum(r[k+1])+gNum(r[k+2]);      // Inversión Leads (Costa/Sierra o Machala/Quito)
    var aware=gNum(r[k+3])+gNum(r[k+4]);     // Inversión AYF (awareness)
    var consid=gNum(r[k+5])+gNum(r[k+6])+gNum(r[k+7])+gNum(r[k+8]); // Posicionamiento + Posventa
    var leads=gNum(r[c.leads]), cpl=gNum(r[c.cpl]);
    if(conv+aware+consid<=0 && leads<=0)continue;
    recs.push({brand:f.marca,model:model,month:f.mes,aware:aware,consid:consid,conv:conv,leads:leads,cpl:cpl});
  }
  return recs;
}
function gBuild(f,rows){
  if(f.digital) return gParseDigital(f,rows);
  var recs=[]; var mv=function(r,key){ var ci=f.map[key]; if(ci==null)return ""; return r[ci]!=null?String(r[ci]).trim():""; };
  for(var i=f.header+1;i<rows.length;i++){ var r=rows[i]; if(!r||!r.join("").trim())continue;
    if(f.tipo==="evento"){ var nm=mv(r,"nombre"); var cost=gNum(mv(r,"inversion")); if(!nm||cost<=0||gIsTotal(nm))continue;
      recs.push({brand:f.marca,month:f.mes,name:nm,cost:cost,photo:"",leads:gNull(mv(r,"leads")),trafico:gNull(mv(r,"trafico")),cotizaciones:gNull(mv(r,"cotizaciones")),veredicto:"",nota:mv(r,"nota")}); }
    else if(f.tipo==="pauta"){ var md=mv(r,"modelo"); var inv=gNum(mv(r,"inversion")); if(!md||inv<=0||gIsTotal(md))continue;
      recs.push({brand:f.marca,model:md,month:f.mes,aware:0,consid:0,conv:inv,leads:gNum(mv(r,"leads")),cpl:gNum(mv(r,"cpl"))}); }
    else { var m2=mv(r,"modelo"); var pers=gNum(mv(r,"personas")); if(!m2||pers<=0||gIsTotal(m2))continue;
      recs.push({brand:f.marca,model:m2,month:f.mes,personas:pers,inversion:gNum(mv(r,"inversion")),sierra:gNull(mv(r,"sierra")),costa:gNull(mv(r,"costa"))}); }
  }
  return recs;
}
function gRender(){
  var b=el("gBody"); if(!b)return; if(!GST.files.length){ b.innerHTML=""; return; }
  var tabs=GST.files.map(function(f,i){ return '<button class="gtab'+(i===GST.cur?" on":"")+'" data-i="'+i+'">'+esc(f.name)+(f.done?" ✓":"")+'</button>'; }).join("");
  var f=GST.files[GST.cur]; var body="";
  if(f.error){ body='<div class="empty">No pude leer este archivo. Guárdalo como .xlsx o .csv y reintenta.</div>'; }
  else if(f.done){ body='<div class="empty">✓ Archivo ya cargado.</div>'; }
  else {
    var rows=rowsOf(f);
    if(!f._detected){ f.digCols=gDigCols(rows); f.digital=!!f.digCols; if(f.digital)f.tipo="pauta"; f._detected=true; }
    var sheetSel='<select id="gSheet">'+f.wb.SheetNames.map(function(sn){return '<option'+(sn===f.sheet?" selected":"")+'>'+esc(sn)+'</option>';}).join("")+'</select>';
    var brandSel='<select id="gMarca"><option value="">— elige —</option>'+BRANDS.map(function(x){return '<option value="'+x.key+'"'+(f.marca===x.key?" selected":"")+'>'+x.name+'</option>';}).join("")+'</select>';
    var pend=Math.min(rows.length,16);
    var previewD='<div class="gtable-wrap"><table class="gtable">'; for(var pr=0;pr<pend;pr++){ var rr=rows[pr]||[]; previewD+='<tr>'; for(var pc=0;pc<Math.min(12,rr.length);pc++){ previewD+='<td>'+esc(String(rr[pc]==null?"":rr[pc]).slice(0,14))+'</td>'; } previewD+='</tr>'; } previewD+='</table></div>';
    if(f.digital){
      var recsD=gParseDigital(f,rows); var readyD=recsD.length&&f.marca&&f.mes;
      body='<div class="banner ok" style="margin:0 0 12px">✦ Detecté <b>formato de Pauta Digital</b>. Solo elige marca y mes — las columnas (CPL, Leads e Inversión por Leads/AYF/Posicionamiento) se leen solas.</div>'
        +'<div class="frow3"><div class="field"><label>Hoja</label>'+sheetSel+'</div><div class="field"><label>Marca</label>'+brandSel+'</div><div class="field"><label>Mes (año-mes)</label><input type="month" id="gMes" value="'+(f.mes||"")+'"></div></div>'
        +previewD
        +'<div class="gprev">Se cargarán <b>'+recsD.length+'</b> modelos como pauta'+(f.marca?'':' — elige la marca')+(f.mes?'':' — pon el mes')+'. La inversión se reparte en awareness (AYF), consideración (posicionamiento) y conversión (leads).</div>'
        +'<div style="display:flex;gap:9px;margin-top:12px"><button class="btn primary" id="gImport"'+(readyD?'':' disabled')+'>Cargar '+recsD.length+' modelos</button><button class="btn" id="gSkip">Saltar</button></div>';
    } else {
      var hdr=rows[f.header]||[]; gAutoMap(f,hdr);
      var tipoSel='<select id="gTipo">'+[["evento","Evento / BTL"],["pauta","Pauta digital"],["trafico","Tráfico"]].map(function(t){return '<option value="'+t[0]+'"'+(f.tipo===t[0]?" selected":"")+'>'+t[1]+'</option>';}).join("")+'</select>';
      var end=Math.min(rows.length,f.header+9);
      var preview='<div class="gtable-wrap"><table class="gtable">'; for(var ri=0;ri<end;ri++){ var r=rows[ri]||[]; preview+='<tr'+(ri===f.header?' class="hrow"':'')+'>'; for(var ci=0;ci<Math.min(10,Math.max(r.length,hdr.length));ci++){ preview+='<td>'+esc(String(r[ci]==null?"":r[ci]).slice(0,16))+'</td>'; } preview+='</tr>'; } preview+='</table></div>';
      var recs=gBuild(f,rows); var ready=recs.length&&f.marca&&f.mes;
      body='<div class="frow3"><div class="field"><label>Hoja</label>'+sheetSel+'</div><div class="field"><label>Marca</label>'+brandSel+'</div><div class="field"><label>Tipo</label>'+tipoSel+'</div></div>'
        +'<div class="frow"><div class="field"><label>Mes (año-mes)</label><input type="month" id="gMes" value="'+(f.mes||"")+'"><div class="ghint">Si el archivo no dice el mes, ponlo aquí.</div></div>'
        +'<div class="field"><label>Fila de encabezados</label><input type="number" id="gHeader" min="0" value="'+f.header+'"><div class="ghint">Qué fila tiene los títulos (0 = la primera).</div></div></div>'
        +preview
        +'<div class="gmap">'+gMapFields(f,hdr)+'</div>'
        +'<div class="gprev">Se cargarán <b>'+recs.length+'</b> registros'+(f.marca?'':' — elige la marca')+(f.mes?'':' — pon el mes')+'.</div>'
        +'<div style="display:flex;gap:9px;margin-top:12px"><button class="btn primary" id="gImport"'+(ready?'':' disabled')+'>Cargar '+recs.length+' registros</button><button class="btn" id="gSkip">Saltar</button></div>';
    }
  }
  b.innerHTML='<div class="gtabs">'+tabs+'</div>'+body;
  b.querySelectorAll(".gtab").forEach(function(t){ t.onclick=function(){ GST.cur=+t.dataset.i; gRender(); }; });
  var on=function(id,key){ var e=el(id); if(!e)return; e.addEventListener("change",function(){ f[key]=(e.type==="number")?(+e.value):e.value; if(key==="sheet"){f.header=0;f._mapped=false;f.map={};f._detected=false;} if(key==="tipo"){f._mapped=false;f.map={};} if(key==="header"){f._mapped=false;f.map={};} gRender(); }); };
  on("gSheet","sheet"); on("gMarca","marca"); on("gTipo","tipo"); on("gMes","mes"); on("gHeader","header");
  b.querySelectorAll("[data-map]").forEach(function(sel){ sel.onchange=function(){ f.map[sel.dataset.map]= sel.value===""?null:(+sel.value); gRender(); }; });
  if(el("gImport")) el("gImport").onclick=function(){ gImport(f); };
  if(el("gSkip")) el("gSkip").onclick=function(){ f.done=true; gNext(); };
}
function gImport(f){
  var recs=gBuild(f,rowsOf(f)); if(!recs.length||!f.marca||!f.mes){ toast("Faltan marca, mes o columnas."); return; }
  var type=f.tipo==="evento"?"event":f.tipo==="pauta"?"campaign":"traffic";
  setSaving(true);
  remoteBulk(type,recs).then(function(r){ if(r&&r.error){ setSaving(false); toast("Error al cargar: "+r.error.message); return; } f.done=true; toast("Cargados "+recs.length+" registros de "+f.name); loadAll(); gNext(); });
}
function gNext(){ var n=-1; for(var i=0;i<GST.files.length;i++){ if(!GST.files[i].done&&!GST.files[i].error){ n=i; break; } } if(n<0){ toast("¡Listo! Todos los archivos procesados."); closeForm(); } else { GST.cur=n; gRender(); } }

// ---- export ----
function exportData(){
  var lines=[];
  lines.push("TIPO,MARCA,MODELO/NOMBRE,MES,AWARENESS,CONSIDERACION,CONVERSION,INVERSION,LEADS,CPL,PERSONAS,SIERRA,COSTA,TRAFICO,COTIZACIONES,VEREDICTO,NOTA");
  DATA.campaigns.forEach(function(c){ lines.push(["Pauta",BNAME[c.brand],csv(c.model),c.month,c.aware,c.consid,c.conv,campTotal(c),c.leads,c.cpl,"","","","","","",""].join(",")); });
  DATA.traffic.forEach(function(t){ lines.push(["Trafico",BNAME[t.brand],csv(t.model),t.month,"","","",t.inversion,"","",t.personas,t.sierra||"",t.costa||"","","","",""].join(",")); });
  DATA.events.forEach(function(e){ lines.push(["Evento",BNAME[e.brand],csv(e.name),e.month,"","","",e.cost,e.leads!=null?e.leads:"","","","","",e.trafico!=null?e.trafico:"",e.cotizaciones!=null?e.cotizaciones:"",e.veredicto?VERD[e.veredicto]:"",csv(e.nota)].join(",")); });
  var csvStr=lines.join("\n");
  downloadBlob("marketing-insights.csv",csvStr);
}
function csv(s){ s=String(s==null?"":s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function fallbackCopy(str){ try{ navigator.clipboard.writeText(str); toast("Datos copiados al portapapeles (pégalos en Excel o en el chat)."); }catch(e){ toast("No se pudo exportar aquí."); } }

// ---- events / binding ----
function el(id){return document.getElementById(id);}
function bind(){
  el("months").addEventListener("change",function(e){if(e.target.id!=="mesSel")return;fM=e.target.value;render();});
  el("brands").addEventListener("change",function(e){if(e.target.id!=="marcaSel")return;fB=e.target.value;render();});
  el("regBtn").addEventListener("click",function(e){e.stopPropagation();var m=el("regMenu");m.hidden=!m.hidden;});
  document.addEventListener("click",function(){var m=el("regMenu");if(m)m.hidden=true;});
  el("regMenu").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;openForm(b.dataset.new);});
  el("exportBtn").addEventListener("click",exportData);
  el("sections").addEventListener("change",function(e){var s=e.target.closest("select[data-brand]");if(!s)return;state[s.dataset.brand]=s.value;render();});
  el("sections").addEventListener("click",function(e){
    var add=e.target.closest("[data-new]"); if(add){ openForm(add.dataset.new,null,add.dataset.brand); return; }
    var ed=e.target.closest("[data-edit]"); if(ed && !readOnly){ var p=ed.getAttribute("data-edit").split(":"); openForm(p[0],p[1]); return; }
  });
}

// ---- boot ----
document.getElementById("root").innerHTML=SHELL;
renderChrome(); bind(); render();
initSB();
loadAll();
if(sb){ try{ sb.channel("mi-realtime")
  .on("postgres_changes",{event:"*",schema:"public",table:"mi_campaigns"},loadAll)
  .on("postgres_changes",{event:"*",schema:"public",table:"mi_traffic"},loadAll)
  .on("postgres_changes",{event:"*",schema:"public",table:"mi_events"},loadAll)
  .subscribe(); }catch(e){} }
</script>
